services:
  db:
    image: postgres:13-alpine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydatabase" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    ports:
      - "3000:3000" # React development server port
    environment:
      - CHOKIDAR_USEPOLLING=true # For hot-reloading in Docker
    depends_on:
      backend-app:
        condition: service_started # Frontend depends on backend for API calls

  backend-app:
    build:
      context: ./backend-app
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    ports:
      - "8080:8080"
    volumes:
      - recordings_store:/var/recordings
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      LEMONFOX_API_KEY: "${LEMONFOX_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
#      transcriber-app:
#        condition: service_started

#  временно закомментировано, локальное распознавание требует слишком много ресурсов
#  transcriber-app:
#    restart: always
#    build:
#      context: ./transcriber-app
#      dockerfile: Dockerfile
#    deploy:
#      resources:
#        limits:
#          cpus: '0.7'
#          memory: 2048M
#    expose:
#      - "8000"
#    tmpfs:
#      - /tmp

  nginx-prod:
    image: nginx:alpine
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    profiles: [ "prod" ]
    ports:
      - "80:80"
      - "443:443"
    command: ["sh", "-c", "chmod +x /usr/local/bin/wait-for-cert.sh && /usr/local/bin/wait-for-cert.sh"] # ждем скриптом появления файлов серта, которые поставляет certbot
    volumes:
      - ./nginx/wait-for-cert.sh:/usr/local/bin/wait-for-cert.sh
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot

  nginx-dev:
    image: nginx:alpine
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    profiles: [ "dev" ]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    # только для получения сертов
    profiles: [ "get-certs" ]
    ports:
      - "80:80"
    volumes:
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --standalone -d pmant.pro --email admin@pmant.pro --agree-tos --non-interactive"

volumes:
  recordings_store:
  db_data:
